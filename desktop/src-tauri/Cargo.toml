[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
# Native file-export SAVE flow (frontend: src/app.js installNativeDownloadInterceptor):
# WKWebView / the custom-scheme origin ignore <a download> + blob:/data: saves, so the app
# reads the export bytes and writes them to a user-chosen path via these two plugins.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Native "Copy" support: navigator.clipboard.writeText is unavailable on the tauri:// origin,
# so the copy shim (src/app.js installNativeClipboardShim) routes through this plugin.
tauri-plugin-clipboard-manager = "2"
