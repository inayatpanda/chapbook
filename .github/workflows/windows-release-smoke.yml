name: Windows release smoke

on:
  push:
    branches: [native-builds]
    paths:
      - .github/workflows/windows-release-smoke.yml
      - scripts/windows-release-smoke.ps1
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft or published release to test
        required: true
        default: desktop-v1.0.10
      installer_sha256:
        description: Independently verified SHA-256 of the x64 NSIS installer
        required: true
        default: 23fd8b2d359b22e31c9df1f7834e871a24d616c44224ab57e950fb868c6a9184

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'desktop-v1.0.10' }}
          EXPECTED_SHA256: ${{ inputs.installer_sha256 || '23fd8b2d359b22e31c9df1f7834e871a24d616c44224ab57e950fb868c6a9184' }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^desktop-v\d+\.\d+\.\d+$') { throw 'Unexpected release tag' }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Expected SHA-256 is required' }
          $version = $env:RELEASE_TAG.Substring('desktop-v'.Length)
          $asset = "Chapbook_${version}_x64-setup.exe"
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          ./scripts/windows-release-smoke.ps1 -Installer "candidate/$asset" -ExpectedSha256 $env:EXPECTED_SHA256 -ExpectedVersion $version
      - name: Preserve installation and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-smoke
          path: windows-smoke-evidence.json
          if-no-files-found: error
          retention-days: 7
