name: Desktop release (Tauri)

# Builds the complete bundle-local Chapbook app, including the private dictation model.
#   • macOS  → universal .dmg (Intel + Apple Silicon), code-signed + notarized
#   • Windows → NSIS .exe installer (unsigned unless a Windows cert is added)
# Trigger by pushing a tag like `desktop-v1.0.0`, or run manually.
#
# REQUIRED SECRETS on THIS repo (same VALUES as the ortho-outcomes repo — copy
# them across; GitHub secrets are write-only so they can't be shared automatically):
#   CSC_LINK                     base64 of the Developer ID .p12 certificate
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     your Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarization
#   APPLE_TEAM_ID                your Apple Developer Team ID (G3RVS73AU3)
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Inayat Panda (G3RVS73AU3)"
# Without these, the mac build is produced UNSIGNED (still works). The Windows
# .exe is always unsigned (no Windows cert). GITHUB_TOKEN is auto-provided.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build the bundle-local app and private dictation model
        run: |
          npm ci
          npm run build
          npm run stage:stt
          # colour glyphs: without this the bundle-local app's Colour picker 404s on
          # /emoji-manifest.json ("Could not load colour icons") — graceful, but a gap.
          npm run stage:emoji

      # Enable mac code-signing ONLY when the Apple secrets are present on this repo.
      # We must NOT export APPLE_SIGNING_IDENTITY at all when it's empty: an empty-but-
      # defined value still makes the Tauri bundler attempt codesigning, which then fails
      # at `security import` because no certificate was imported. Writing the vars to
      # $GITHUB_ENV only in the `-n` branch means an unset secret => truly-absent env =>
      # an UNSIGNED (but successful) mac build.
      - name: Configure mac signing (only if Apple secrets exist)
        if: matrix.platform == 'macos-latest'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT_B64: ${{ secrets.CSC_LINK }}
          CERT_PW: ${{ secrets.CSC_KEY_PASSWORD }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            echo "Apple secrets present → building a SIGNED + notarized DMG."
            {
              echo "APPLE_SIGNING_IDENTITY=$SIGN_IDENTITY"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
              echo "APPLE_ID=$A_ID"
              echo "APPLE_PASSWORD=$A_PW"
              echo "APPLE_TEAM_ID=$A_TEAM"
              # cert is base64 and may span lines → heredoc form is newline-safe
              echo "APPLE_CERTIFICATE<<__CERT_EOF__"
              echo "$CERT_B64"
              echo "__CERT_EOF__"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple secrets → building an UNSIGNED mac app (this is expected)."
          fi

      - name: Build + (mac) sign & notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing vars (if any) are injected into the environment by the
          # "Configure mac signing" step above via $GITHUB_ENV — never hardcoded here.
        with:
          projectPath: desktop
          tauriScript: npx tauri
          # BUNDLE-LOCAL, chosen deliberately: dist/ and the Whisper dictation model are
          # baked into the binary, so speech-to-text is preinstalled and works offline with
          # no first-use download. The cost is that the UI is a SNAPSHOT — a site deploy
          # does NOT reach installed apps, so every UI change needs a new signed release.
          # Dropping this --config builds the remote-loading shell instead (window opens
          # chapbook.rqai.co.uk/app, deploys land automatically, model downloads on first use).
          args: --config src-tauri/tauri.bundle-local.conf.json ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Chapbook Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # Tauri notarizes the .app INSIDE the DMG but neither notarizes nor staples the
      # DMG container itself (learned on desktop-v1.0.1: spctl rejects the DMG as
      # "Unnotarized Developer ID" even though the app's ticket was Accepted). Submit
      # the DMG for its own ticket, staple it, and replace the release asset so the
      # download passes Gatekeeper offline. Runs only when signing env was configured.
      - name: Notarize + staple the DMG container (mac, signed builds only)
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing DMG container: $DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t install "$DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
          echo "Stapled DMG re-uploaded to ${{ github.ref_name }}"
